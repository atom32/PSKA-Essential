[project]
name = "pska-essential"
version = "0.1.0"
description = "Agent Knowledge Workflow Gate for PSKA-Essential"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2"]
ragflow = ["ragflow-sdk>=0.19.0"]
graphiti = ["graphiti-core>=0.29,<0.30"]
graphiti-falkordb = ["graphiti-core[falkordb]>=0.29,<0.30"]
extract-markitdown = ["markitdown>=0.1.0,<1"]
extract-docling = ["docling>=2.0.0,<3"]
extract-tika = ["tika>=2.6.0,<3"]
watch = ["watchdog>=4.0.0,<7"]
observability = ["opentelemetry-api>=1.25.0,<2", "opentelemetry-sdk>=1.25.0,<2", "arize-phoenix>=8.0.0,<9"]
eval = ["ragas>=0.2.0,<1", "deepeval>=1.0.0,<2"]
workflow-temporal = ["temporalio>=1.6.0,<2"]
dev = ["pytest>=8.0.0"]

[project.scripts]
pska-essential-mcp = "pska_essential.mcp_server:main"
pska-essential-api = "pska_essential.product_api:main"
pska-essential-component-check = "pska_essential.component_check:main"
pska-essential-workspace-status = "pska_essential.workspace_status_cli:main"
pska-essential-eval = "pska_essential.eval:main"
pska-essential-ingest-loop = "pska_essential.ingest_loop:main"
pska-essential-ingest-loop-resume = "pska_essential.ingest_loop:resume_main"
pska-essential-review-memory-smoke = "pska_essential.review_memory_smoke:main"
pska-essential-source-watch = "pska_essential.source_watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
