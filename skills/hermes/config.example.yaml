mcp_servers:
  pska-essential:
    command: "python3"
    args:
      - "-m"
      - "pska_essential"
      - "--env-file"
      - "/Users/xudawei/PSKA-Essential/.env.pska"
    env:
      PYTHONPATH: "/Users/xudawei/PSKA-Essential/src"
    tools:
      include:
        # Daily Hermes/WebUI surface:
        # WebUI -> Hermes -> PSKA-Essential -> RAGFlow / other KB providers.
        # Keep provider admin, ingest, eval, delete, and manual apply tools out
        # of the normal chat entry. They remain available through PSKA operator
        # surfaces or a deliberately broader admin profile.
        - pska_workspace_status
        - pska_policy_get
        - pska_capabilities_get
        - pska_kb_list
        - pska_kb_readiness
        - pska_kb_ingestion_status
        - pska_kb_document_status
        - pska_retrieval_probe
        - pska_context_retrieve
        - pska_source_read
        - pska_agentic_question_start
        - pska_agentic_question_resumable
        - pska_agentic_question_resume
        - pska_memory_search
        - pska_memory_change_from_conversation
        - pska_memory_lifecycle
        - pska_review_list
        - pska_review_get
        - pska_provider_jobs
        - pska_runtime_diagnostics
        - pska_component_check
